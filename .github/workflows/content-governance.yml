name: content-governance
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  content-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/content_governance.py check
      - run: python3 -m unittest discover -s test -p 'test_*.py'
